# zktest: the web image on the host network, in front of the systemd API (see README「常驻部署」).
server {
    listen 127.0.0.1:15176;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    location /api/ { proxy_pass http://127.0.0.1:18100; proxy_set_header Host $host; }
    location /health { proxy_pass http://127.0.0.1:18100; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
