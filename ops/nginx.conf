server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    location /api/ { proxy_pass http://api:8100; proxy_set_header Host $host; }
    location /health/ { proxy_pass http://api:8100; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
