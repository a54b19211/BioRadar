name: ${COMPOSE_PROJECT_NAME:-bioradar-dev}

x-backend: &backend
  build:
    context: ..
    dockerfile: ops/Dockerfile.api
    network: host
    additional_contexts:
      contract-wheels: ${EXTRACTION_CONTRACT_WHEELS:-../../extraction-contract/dist}
      transport-wheels: ${LLM_TRANSPORT_WHEELS:-../../llm-transport/dist}
    args:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
  env_file: .env
  environment:
    BIORADAR_DATABASE_URL: postgresql+psycopg://bioradar:${POSTGRES_PASSWORD:?Run make init}@postgres:5432/bioradar
    BIORADAR_REDIS_URL: redis://redis:6379/0
  init: true

services:
  postgres:
    restart: unless-stopped
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_DB: bioradar
      POSTGRES_USER: bioradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15436}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioradar -d bioradar"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    <<: *backend
    command: ["alembic", "-c", "db/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-18100}:8100"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    <<: *backend
    command: ["python", "-m", "bioradar.ops", "worker"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  monitor:
    <<: *backend
    command: ["python", "-m", "bioradar.ops", "monitor"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    ports: ["127.0.0.1:${WEB_PORT:-15176}:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
