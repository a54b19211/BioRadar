[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bioradar"
version = "1.0.0"
description = "BioRadar: medical and public-health intelligence radar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "redis>=5,<8", "rq>=2,<3", "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",  # MechEvidence receipts against its published schema (GET /v2/contract)
  "openai>=2,<3",
]

[tool.uv]
# the one uv of the environment (README, 启动); uv refuses to run this project with another version
required-version = "==0.13.0"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services", "tests", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# the base rule set of every repository: pyflakes, the pycodestyle errors that are bugs or
# hide statements, whitespace, import order. Complexity is gated by scripts/code_metrics.py, not by C90.
# Extra here: all of E, line length (E501) included.
select = ["E4", "E7", "E9", "F", "W", "I"]
extend-select = ["E"]

[tool.ruff.lint.isort]
known-first-party = ["bioradar"]

[tool.ruff.lint.per-file-ignores]
"services/bioradar/research/prompts.py" = ["E501"]

[tool.code-metrics]
# what scripts/code_metrics.py measures (that script is the same file in every repository)
paths = ["services"]
