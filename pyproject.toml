[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bioradar"
version = "0.5.0"
description = "BioRadar intelligence application: shared capabilities, independent research lifecycle"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "redis>=5,<8", "rq>=2,<3", "httpx>=0.28,<1", "jsonschema==4.26.0",
  "numpy>=2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "networkx>=3.4,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "openapi-spec-validator==0.9.0"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["BOOT: framework and adapter boundary verification", "ENGINE: discovery engine verification"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
