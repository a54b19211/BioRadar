[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bioradar"
version = "1.0.0"
description = "BioRadar: medical and public-health intelligence radar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "redis>=5,<8", "rq>=2,<3", "httpx>=0.28,<1",
  "extraction-contract==1.14.0",  # pinned by wheel hash: requirements-contract.txt
  "zk-llm-transport==0.1.1",  # pinned by wheel hash: requirements-transport.txt
]

[tool.uv]
# the one uv of the environment (README, 启动); uv refuses to run this project with another version
required-version = "==0.13.0"
# the shared wheels, built from the sibling extraction-contract and llm-transport checkouts (README)
find-links = ["../extraction-contract/dist", "../llm-transport/dist"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services", "tests", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bioradar"]

[tool.ruff.lint.per-file-ignores]
"services/bioradar/research/prompts.py" = ["E501"]
